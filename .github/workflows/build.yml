name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        firmware: [official, unleashed]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned SDK and toolchain
        run: python tools/bootstrap.py --firmware ${{ matrix.firmware }}
      - name: Run portable core, virtual card, transport and Python tests
        run: python tools/test.py --firmware ${{ matrix.firmware }}
      - name: Build FAP
        run: python tools/build.py --firmware ${{ matrix.firmware }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hinata-usb-f7-${{ matrix.firmware }}
          path: |
            dist/${{ matrix.firmware }}/hinata_usb.fap
            dist/${{ matrix.firmware }}/build-manifest.json
            build/test-results.json
          if-no-files-found: error
